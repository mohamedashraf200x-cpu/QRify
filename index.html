<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QRify</title>

<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QRify">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

body.dark {
  background: #111827;
  color: white;
}

header {
  background: #111827;
  color: white;
  text-align: center;
  padding: 15px;
}

header img {
  width: 180px;
  max-width: 80%;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.dark .card {
  background: #1f2937;
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

input,
select,
textarea,
button {
  width: 100%;
  padding: 12px;
  margin-top: 7px;
  border-radius: 10px;
  border: 1px solid #d1d5db;
  font-size: 16px;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

button {
  border: none;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.secondary {
  background: #6b7280;
}

.green {
  background: #16a34a;
}

.red {
  background: #dc2626;
}

.dark input,
.dark select,
.dark textarea {
  background: #374151;
  color: white;
  border-color: #4b5563;
}

.type-buttons {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 15px;
}

.type-btn {
  background: #e5e7eb;
  color: #111827;
}

.type-btn.active {
  background: #2563eb;
  color: white;
}

.dark .type-btn {
  background: #374151;
  color: white;
}

.dark .type-btn.active {
  background: #2563eb;
}

.form-section {
  display: none;
}

.form-section.active {
  display: block;
}

#qrcode {
  text-align: center;
  margin: 20px 0;
}

#qrcode img,
#qrcode canvas {
  max-width: 100%;
  margin: auto;
}

.scanner-box {
  display: none;
  margin-top: 15px;
}

#reader {
  width: 100%;
}

#scanResult {
  display: none;
  margin-top: 15px;
  padding: 15px;
  border-radius: 10px;
  background: #e5e7eb;
  word-break: break-word;
}

.dark #scanResult {
  background: #374151;
}

.history-item {
  background: #f3f4f6;
  padding: 10px;
  border-radius: 8px;
  margin-top: 8px;
  word-break: break-word;
}

.dark .history-item {
  background: #374151;
}

footer {
  text-align: center;
  padding: 20px;
  color: #6b7280;
}

.small-note {
  font-size: 13px;
  color: #6b7280;
  margin-top: 5px;
}

.dark .small-note {
  color: #d1d5db;
}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="QRify Logo">
</header>

<div class="container">

<!-- ================= QR GENERATOR ================= -->

<div class="card">

<h2>🔳 Generate QR Code</h2>

<label>Choose QR Type</label>

<div class="type-buttons">

<button class="type-btn active" onclick="selectType('text', this)">
📝 Text
</button>

<button class="type-btn" onclick="selectType('website', this)">
🌐 Website
</button>

<button class="type-btn" onclick="selectType('phone', this)">
📞 Phone
</button>

<button class="type-btn" onclick="selectType('email', this)">
📧 Email
</button>

<button class="type-btn" onclick="selectType('wifi', this)">
📶 Wi-Fi
</button>

<button class="type-btn" onclick="selectType('contact', this)">
👤 Contact
</button>

<button class="type-btn" onclick="selectType('location', this)">
📍 Location
</button>

</div>


<!-- TEXT -->

<div id="textSection" class="form-section active">

<h3>📝 Text</h3>

<label>Enter Message</label>

<textarea
id="textInput"
placeholder="Type your message here..."
></textarea>

</div>


<!-- WEBSITE -->

<div id="websiteSection" class="form-section">

<h3>🌐 Website</h3>

<label>Website URL</label>

<input
type="url"
id="websiteInput"
placeholder="https://example.com"
>

</div>


<!-- PHONE -->

<div id="phoneSection" class="form-section">

<h3>📞 Phone</h3>

<label>Phone Number</label>

<input
type="tel"
id="phoneInput"
placeholder="+91 9876543210"
>

</div>


<!-- EMAIL -->

<div id="emailSection" class="form-section">

<h3>📧 Email</h3>

<label>Email Address</label>

<input
type="email"
id="emailInput"
placeholder="example@gmail.com"
>

<label>Subject</label>

<input
type="text"
id="emailSubject"
placeholder="Email subject"
>

<label>Message</label>

<textarea
id="emailMessage"
placeholder="Email message"
></textarea>

</div>


<!-- WIFI -->

<div id="wifiSection" class="form-section">

<h3>📶 Wi-Fi</h3>

<label>Network Name (SSID)</label>

<input
type="text"
id="wifiName"
placeholder="Wi-Fi name"
>

<label>Password</label>

<input
type="text"
id="wifiPassword"
placeholder="Wi-Fi password"
>

<label>Security</label>

<select id="wifiSecurity">

<option value="WPA">WPA/WPA2</option>
<option value="WEP">WEP</option>
<option value="nopass">No Password</option>

</select>

</div>


<!-- CONTACT -->

<div id="contactSection" class="form-section">

<h3>👤 Contact</h3>

<label>Full Name</label>

<input
type="text"
id="contactName"
placeholder="Your name"
>

<label>Phone Number</label>

<input
type="tel"
id="contactPhone"
placeholder="+91 9876543210"
>

<label>Email</label>

<input
type="email"
id="contactEmail"
placeholder="example@gmail.com"
>

<label>Organization</label>

<input
type="text"
id="contactOrganization"
placeholder="Company / Organization"
>

</div>


<!-- LOCATION -->

<div id="locationSection" class="form-section">

<h3>📍 Location</h3>

<label>Latitude</label>

<input
type="text"
id="latitude"
placeholder="Example: 12.9165"
>

<label>Longitude</label>

<input
type="text"
id="longitude"
placeholder="Example: 79.1325"
>

<div class="small-note">
Example: Enter the latitude and longitude of a place.
</div>

</div>


<!-- QR SETTINGS -->

<label>QR Size</label>

<select id="qrSize">

<option value="180">Small</option>
<option value="250" selected>Medium</option>
<option value="320">Large</option>

</select>


<label>QR Color</label>

<input
type="color"
id="qrColor"
value="#000000"
>


<label>Background Color</label>

<input
type="color"
id="bgColor"
value="#ffffff"
>


<button onclick="generateQR()">
🔳 Generate QR
</button>


<div id="qrcode"></div>


<button
id="downloadBtn"
class="green"
style="display:none;"
onclick="downloadQR()"
>
⬇️ Download QR
</button>


<button
class="secondary"
onclick="clearQR()"
>
🗑️ Clear
</button>

</div>


<!-- ================= QR SCANNER ================= -->

<div class="card">

<h2>📷 Scan QR</h2>

<button onclick="startCameraScanner()">
📷 Scan Using Camera
</button>


<button
class="secondary"
onclick="document.getElementById('qrImageInput').click()"
>
🖼️ Scan From Image / Photo
</button>


<input
type="file"
id="qrImageInput"
accept="image/*"
style="display:none;"
onchange="scanFromImage(event)"
>


<div id="scannerBox" class="scanner-box">

<div id="reader"></div>

<button
class="red"
onclick="stopScanner()"
>
✖ Stop Camera
</button>

</div>


<div id="scanResult">

<strong>QR Result:</strong>

<p id="resultText"></p>

<button
id="openLinkBtn"
class="green"
style="display:none;"
onclick="openScannedLink()"
>
🔗 Open Link
</button>

</div>

</div>


<!-- ================= HISTORY ================= -->

<div class="card">

<h2>🕘 QR History</h2>

<div id="history"></div>

<button
class="red"
onclick="clearHistory()"
>
Clear History
</button>

</div>


<!-- ================= SETTINGS ================= -->

<div class="card">

<h2>⚙️ Settings</h2>

<button onclick="toggleDarkMode()">
🌙 Dark Mode
</button>

</div>

</div>


<footer>
QRify • Generate • Scan • Simplify
<br>
By Ashraf
</footer>


<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<script src="https://unpkg.com/html5-qrcode"></script>


<script>

/* ===============================
   CURRENT QR TYPE
================================ */

let currentType = "text";

let scanner = null;

let lastScannedResult = "";


/* ===============================
   SELECT QR TYPE
================================ */

function selectType(type, button) {

  currentType = type;

  document.querySelectorAll(".type-btn")
    .forEach(function(btn) {
      btn.classList.remove("active");
    });

  button.classList.add("active");


  document.querySelectorAll(".form-section")
    .forEach(function(section) {
      section.classList.remove("active");
    });


  document.getElementById(type + "Section")
    .classList.add("active");
}


/* ===============================
   GET QR DATA
================================ */

function getQRData() {

  /* TEXT */

  if (currentType === "text") {

    const text =
      document.getElementById("textInput")
      .value.trim();

    if (!text) {
      alert("Please enter your message.");
      return null;
    }

    return text;
  }


  /* WEBSITE */

  if (currentType === "website") {

    let url =
      document.getElementById("websiteInput")
      .value.trim();

    if (!url) {
      alert("Please enter a website URL.");
      return null;
    }

    if (
      !url.startsWith("http://") &&
      !url.startsWith("https://")
    ) {
      url = "https://" + url;
    }

    return url;
  }


  /* PHONE */

  if (currentType === "phone") {

    const phone =
      document.getElementById("phoneInput")
      .value.trim();

    if (!phone) {
      alert("Please enter a phone number.");
      return null;
    }

    return "tel:" + phone;
  }


  /* EMAIL */

  if (currentType === "email") {

    const email =
      document.getElementById("emailInput")
      .value.trim();

    const subject =
      document.getElementById("emailSubject")
      .value.trim();

    const message =
      document.getElementById("emailMessage")
      .value.trim();

    if (!email) {
      alert("Please enter an email address.");
      return null;
    }

    return (
      "mailto:" +
      email +
      "?subject=" +
      encodeURIComponent(subject) +
      "&body=" +
      encodeURIComponent(message)
    );
  }


  /* WIFI */

  if (currentType === "wifi") {

    const name =
      document.getElementById("wifiName")
      .value.trim();

    const password =
      document.getElementById("wifiPassword")
      .value;

    const security =
      document.getElementById("wifiSecurity")
      .value;

    if (!name) {
      alert("Please enter the Wi-Fi name.");
      return null;
    }

    return (
      "WIFI:T:" +
      security +
      ";S:" +
      escapeWifi(name) +
      ";P:" +
      escapeWifi(password) +
      ";;"
    );
  }


  /* CONTACT */

  if (currentType === "contact") {

    const name =
      document.getElementById("contactName")
      .value.trim();

    const phone =
      document.getElementById("contactPhone")
      .value.trim();

    const email =
      document.getElementById("contactEmail")
      .value.trim();

    const organization =
      document.getElementById("contactOrganization")
      .value.trim();

    if (!name && !phone && !email) {

      alert("Please enter contact information.");

      return null;
    }

    return (
      "BEGIN:VCARD\n" +
      "VERSION:3.0\n" +
      "FN:" + name + "\n" +
      "TEL:" + phone + "\n" +
      "EMAIL:" + email + "\n" +
      "ORG:" + organization + "\n" +
      "END:VCARD"
    );
  }


  /* LOCATION */

  if (currentType === "location") {

    const latitude =
      document.getElementById("latitude")
      .value.trim();

    const longitude =
      document.getElementById("longitude")
      .value.trim();

    if (!latitude || !longitude) {

      alert(
        "Please enter latitude and longitude."
      );

      return null;
    }

    return (
      "https://www.google.com/maps?q=" +
      encodeURIComponent(latitude) +
      "," +
      encodeURIComponent(longitude)
    );
  }

}


/* ===============================
   WIFI ESCAPE
================================ */

function escapeWifi(value) {

  return value.replace(
    /([\\;,:"])/g,
    "\\$1"
  );
}


/* ===============================
   GENERATE QR
================================ */

function generateQR() {

  const finalText = getQRData();

  if (!finalText) {
    return;
  }


  const size =
    parseInt(
      document.getElementById("qrSize").value
    );


  const color =
    document.getElementById("qrColor").value;


  const background =
    document.getElementById("bgColor").value;


  const container =
    document.getElementById("qrcode");


  container.innerHTML = "";


  new QRCode(container, {

    text: finalText,

    width: size,

    height: size,

    colorDark: color,

    colorLight: background,

    correctLevel:
      QRCode.CorrectLevel.H

  });


  document.getElementById("downloadBtn")
    .style.display = "block";


  saveHistory(finalText);
}


/* ===============================
   DOWNLOAD QR
================================ */

function downloadQR() {

  const qrImage =
    document.querySelector("#qrcode img");


  if (!qrImage) {

    alert("Generate a QR first.");

    return;
  }


  const size =
    qrImage.naturalWidth || 250;


  const border = 30;


  const canvas =
    document.createElement("canvas");


  canvas.width =
    size + border * 2;

  canvas.height =
    size + border * 2;


  const ctx =
    canvas.getContext("2d");


  ctx.fillStyle = "#ffffff";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.drawImage(
    qrImage,
    border,
    border,
    size,
    size
  );


  const link =
    document.createElement("a");


  link.download =
    "QRify-QR.png";


  link.href =
    canvas.toDataURL("image/png");


  link.click();
}


/* ===============================
   CLEAR QR
================================ */

function clearQR() {

  document.getElementById("qrcode")
    .innerHTML = "";


  document.getElementById("downloadBtn")
    .style.display = "none";


  document.querySelectorAll(
    "input, textarea"
  ).forEach(function(input) {

    if (input.type !== "color") {
      input.value = "";
    }

  });
}


/* ===============================
   CAMERA SCANNER
================================ */

function startCameraScanner() {

  document.getElementById("scannerBox")
    .style.display = "block";


  if (scanner) {
    return;
  }


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      showScanResult(decodedText);

      stopScanner();

    },

    function(errorMessage) {

      // Normal scanning errors ignored.

    }

  ).catch(function(error) {

    alert(
      "Camera permission denied or camera unavailable."
    );

    scanner = null;

  });
}


/* ===============================
   STOP SCANNER
================================ */

function stopScanner() {

  if (!scanner) {

    document.getElementById("scannerBox")
      .style.display = "none";

    return;
  }


  scanner.stop()

    .then(function() {

      scanner.clear();

      scanner = null;

      document.getElementById("scannerBox")
        .style.display = "none";

    })

    .catch(function() {

      scanner = null;

      document.getElementById("scannerBox")
        .style.display = "none";

    });
}


/* ===============================
   IMAGE / PHOTO SCANNER
================================ */

function scanFromImage(event) {

  const file =
    event.target.files[0];


  if (!file) {
    return;
  }


  document.getElementById("scanResult")
    .style.display = "block";


  document.getElementById("resultText")
    .textContent =
    "🔍 Scanning image...";


  document.getElementById("openLinkBtn")
    .style.display = "none";


  const imageScanner =
    new Html5Qrcode("reader");


  imageScanner.scanFile(file, true)

    .then(function(decodedText) {

      showScanResult(decodedText);

      imageScanner.clear();

    })

    .catch(function(error) {

      document.getElementById("resultText")
        .textContent =
        "❌ QR code not found in this image.";


      document.getElementById("openLinkBtn")
        .style.display = "none";


      imageScanner.clear();

    });


  event.target.value = "";
}


/* ===============================
   SHOW SCAN RESULT
================================ */

function showScanResult(decodedText) {

  lastScannedResult =
    decodedText;


  document.getElementById("scanResult")
    .style.display = "block";


  document.getElementById("resultText")
    .textContent =
    decodedText;


  if (
    decodedText.startsWith("http://") ||
    decodedText.startsWith("https://") ||
    decodedText.startsWith("www.")
  ) {

    document.getElementById("openLinkBtn")
      .style.display = "block";

  } else {

    document.getElementById("openLinkBtn")
      .style.display = "none";

  }
}


/* ===============================
   OPEN SCANNED LINK
================================ */

function openScannedLink() {

  let url =
    lastScannedResult;


  if (url.startsWith("www.")) {

    url =
      "https://" + url;
  }


  if (
    url.startsWith("http://") ||
    url.startsWith("https://")
  ) {

    window.open(
      url,
      "_blank"
    );
  }
}


/* ===============================
   HISTORY
================================ */

function saveHistory(text) {

  let history =
    JSON.parse(
      localStorage.getItem("qrifyHistory") || "[]"
    );


  history.unshift(text);


  history =
    history.slice(0, 5);


  localStorage.setItem(
    "qrifyHistory",
    JSON.stringify(history)
  );


  displayHistory();
}


function displayHistory() {

  const container =
    document.getElementById("history");


  const history =
    JSON.parse(
      localStorage.getItem("qrifyHistory") || "[]"
    );


  if (history.length === 0) {

    container.innerHTML =
      "<p>No history yet.</p>";

    return;
  }


  container.innerHTML = "";


  history.forEach(function(item) {

    const div =
      document.createElement("div");


    div.className =
      "history-item";


    div.textContent =
      item;


    container.appendChild(div);

  });
}


function clearHistory() {

  localStorage.removeItem(
    "qrifyHistory"
  );


  displayHistory();
}


/* ===============================
   DARK MODE
================================ */

function toggleDarkMode() {

  document.body.classList.toggle("dark");


  localStorage.setItem(
    "qrifyDark",
    document.body.classList.contains("dark")
  );
}


if (
  localStorage.getItem("qrifyDark") === "true"
) {

  document.body.classList.add("dark");
}


/* ===============================
   LOAD HISTORY
================================ */

displayHistory();


/* ===============================
   PWA SERVICE WORKER
================================ */

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./sw.js")
        .catch(function(error) {

          console.log(
            "Service Worker error:",
            error
          );

        });

    }
  );
}

</script>

</body>
  </html>
