<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QRify</title>

<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QRify">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
  transition: 0.3s;
}

body.dark {
  background: #111827;
  color: white;
}

header {
  background: #111827;
  color: white;
  padding: 15px;
  text-align: center;
}

header img {
  width: 180px;
  max-width: 80%;
}

.container {
  max-width: 600px;
  margin: 20px auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.dark .card {
  background: #1f2937;
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

input,
select,
textarea,
button {
  width: 100%;
  padding: 12px;
  margin-top: 7px;
  border-radius: 10px;
  border: 1px solid #d1d5db;
  font-size: 16px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  border: none;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.secondary {
  background: #6b7280;
}

.green {
  background: #16a34a;
}

.red {
  background: #dc2626;
}

.dark input,
.dark select,
.dark textarea {
  background: #374151;
  color: white;
  border-color: #4b5563;
}

#qrcode {
  text-align: center;
  margin-top: 20px;
}

#qrcode img,
#qrcode canvas {
  max-width: 100%;
}

.scanner-box {
  display: none;
  margin-top: 15px;
}

#reader {
  width: 100%;
}

#scanResult {
  display: none;
  margin-top: 15px;
  padding: 15px;
  border-radius: 10px;
  background: #e5e7eb;
  word-break: break-word;
}

.dark #scanResult {
  background: #374151;
}

.history-item {
  background: #f3f4f6;
  padding: 10px;
  border-radius: 8px;
  margin-top: 8px;
  word-break: break-word;
}

.dark .history-item {
  background: #374151;
}

footer {
  text-align: center;
  padding: 20px;
  color: #6b7280;
}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="QRify Logo">
</header>

<div class="container">

  <!-- QR GENERATOR -->
  <div class="card">

    <h2>🔳 Generate QR Code</h2>

    <label>QR Type</label>
    <select id="qrType" onchange="changeType()">
      <option value="text">Text</option>
      <option value="website">Website</option>
      <option value="phone">Phone</option>
      <option value="email">Email</option>
      <option value="wifi">Wi-Fi</option>
      <option value="contact">Contact</option>
      <option value="location">Location</option>
    </select>

    <label>Information</label>
    <textarea id="qrInput" placeholder="Enter your information"></textarea>

    <label>QR Size</label>
    <select id="qrSize">
      <option value="180">Small</option>
      <option value="250" selected>Medium</option>
      <option value="320">Large</option>
    </select>

    <label>QR Color</label>
    <input type="color" id="qrColor" value="#000000">

    <label>Background Color</label>
    <input type="color" id="bgColor" value="#ffffff">

    <button onclick="generateQR()">Generate QR</button>

    <div id="qrcode"></div>

    <button id="downloadBtn"
            class="green"
            style="display:none;"
            onclick="downloadQR()">
      ⬇️ Download QR
    </button>

    <button class="secondary" onclick="clearQR()">
      🗑️ Clear
    </button>

  </div>


  <!-- QR SCANNER -->
  <div class="card">

    <h2>📷 Scan QR</h2>

    <button onclick="startCameraScanner()">
      📷 Scan Using Camera
    </button>

    <button class="secondary" onclick="document.getElementById('qrImageInput').click()">
      🖼️ Scan QR From Image / Photo
    </button>

    <input
      type="file"
      id="qrImageInput"
      accept="image/*"
      style="display:none;"
      onchange="scanFromImage(event)"
    >

    <div id="scannerBox" class="scanner-box">
      <div id="reader"></div>

      <button
        class="red"
        onclick="stopScanner()"
        style="margin-top:10px;">
        ✖ Stop Camera
      </button>
    </div>

    <div id="scanResult">
      <strong>QR Result:</strong>
      <p id="resultText"></p>

      <button
        id="openLinkBtn"
        class="green"
        style="display:none;"
        onclick="openScannedLink()">
        🔗 Open Link
      </button>
    </div>

  </div>


  <!-- HISTORY -->
  <div class="card">

    <h2>🕘 History</h2>

    <div id="history"></div>

    <button class="red" onclick="clearHistory()">
      Clear History
    </button>

  </div>


  <!-- SETTINGS -->
  <div class="card">

    <h2>⚙️ Settings</h2>

    <button onclick="toggleDarkMode()">
      🌙 Dark Mode
    </button>

  </div>

</div>

<footer>
  QRify • Generate • Scan • Simplify
  <br>
  By Ashraf
</footer>


<!-- QR GENERATOR LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<!-- QR SCANNER LIBRARY -->
<script src="https://unpkg.com/html5-qrcode"></script>


<script>

let scanner = null;
let lastScannedResult = "";


/* =========================
   QR GENERATOR
========================= */

function changeType() {

  const type = document.getElementById("qrType").value;
  const input = document.getElementById("qrInput");

  const placeholders = {

    text: "Enter text here",

    website: "https://example.com",

    phone: "+91 9876543210",

    email: "example@gmail.com",

    wifi: "WIFI:T:WPA;S:WiFiName;P:Password;;",

    contact: "Name, Phone, Email",

    location: "12.9716,77.5946"

  };

  input.placeholder = placeholders[type] || "Enter information";
}


/* =========================
   GENERATE QR
========================= */

function generateQR() {

  const input = document.getElementById("qrInput").value.trim();

  if (!input) {
    alert("Please enter some information.");
    return;
  }

  const size =
    parseInt(document.getElementById("qrSize").value);

  const color =
    document.getElementById("qrColor").value;

  const background =
    document.getElementById("bgColor").value;

  const qrType =
    document.getElementById("qrType").value;

  let finalText = input;


  /* Website */

  if (qrType === "website") {

    if (
      !input.startsWith("http://") &&
      !input.startsWith("https://")
    ) {
      finalText = "https://" + input;
    }

  }


  /* Phone */

  if (qrType === "phone") {
    finalText = "tel:" + input;
  }


  /* Email */

  if (qrType === "email") {
    finalText = "mailto:" + input;
  }


  /* Clear previous QR */

  const qrContainer =
    document.getElementById("qrcode");

  qrContainer.innerHTML = "";


  /* Create QR */

  new QRCode(qrContainer, {

    text: finalText,

    width: size,

    height: size,

    colorDark: color,

    colorLight: background,

    correctLevel: QRCode.CorrectLevel.H

  });


  document.getElementById("downloadBtn").style.display =
    "block";


  saveHistory(finalText);
}


/* =========================
   DOWNLOAD QR
========================= */

function downloadQR() {

  const qr =
    document.querySelector("#qrcode img");

  if (!qr) {
    alert("Generate a QR first.");
    return;
  }

  const size = qr.naturalWidth || 250;

  const border = 30;

  const canvas =
    document.createElement("canvas");

  canvas.width = size + border * 2;
  canvas.height = size + border * 2;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#ffffff";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.drawImage(
    qr,
    border,
    border,
    size,
    size
  );

  const link =
    document.createElement("a");

  link.download = "QRify-QR.png";

  link.href =
    canvas.toDataURL("image/png");

  link.click();
}


/* =========================
   CLEAR QR
========================= */

function clearQR() {

  document.getElementById("qrcode").innerHTML = "";

  document.getElementById("qrInput").value = "";

  document.getElementById("downloadBtn").style.display =
    "none";
}


/* =========================
   CAMERA SCANNER
========================= */

function startCameraScanner() {

  const scannerBox =
    document.getElementById("scannerBox");

  scannerBox.style.display = "block";

  if (scanner) {
    return;
  }

  scanner =
    new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      showScanResult(decodedText);

      stopScanner();

    },

    function(errorMessage) {

      // Normal scanning errors are ignored.

    }

  ).catch(function(error) {

    alert(
      "Camera permission denied or camera unavailable."
    );

    scanner = null;

  });
}


/* =========================
   STOP SCANNER
========================= */

function stopScanner() {

  if (!scanner) {

    document.getElementById("scannerBox")
      .style.display = "none";

    return;

  }

  scanner.stop()
    .then(function() {

      scanner.clear();

      scanner = null;

      document.getElementById("scannerBox")
        .style.display = "none";

    })
    .catch(function() {

      scanner = null;

      document.getElementById("scannerBox")
        .style.display = "none";

    });
}


/* =========================
   SCAN QR FROM IMAGE
========================= */

function scanFromImage(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }

  const resultBox =
    document.getElementById("scanResult");

  resultBox.style.display = "block";

  document.getElementById("resultText").textContent =
    "Scanning image...";

  document.getElementById("openLinkBtn").style.display =
    "none";


  const imageScanner =
    new Html5Qrcode("reader");


  imageScanner.scanFile(file, true)

    .then(function(decodedText) {

      showScanResult(decodedText);

      imageScanner.clear();

    })

    .catch(function(error) {

      document.getElementById("resultText").textContent =
        "❌ QR code not found in this image.";

      document.getElementById("openLinkBtn").style.display =
        "none";

      imageScanner.clear();

    });


  /* Reset input so same image can be selected again */

  event.target.value = "";
}


/* =========================
   SHOW SCAN RESULT
========================= */

function showScanResult(decodedText) {

  lastScannedResult = decodedText;

  const resultBox =
    document.getElementById("scanResult");

  const resultText =
    document.getElementById("resultText");

  const openButton =
    document.getElementById("openLinkBtn");


  resultBox.style.display = "block";

  resultText.textContent =
    decodedText;


  if (
    decodedText.startsWith("http://") ||
    decodedText.startsWith("https://") ||
    decodedText.startsWith("www.")
  ) {

    openButton.style.display =
      "block";

  } else {

    openButton.style.display =
      "none";

  }
}


/* =========================
   OPEN SCANNED LINK
========================= */

function openScannedLink() {

  let url =
    lastScannedResult;

  if (url.startsWith("www.")) {
    url = "https://" + url;
  }

  if (
    url.startsWith("http://") ||
    url.startsWith("https://")
  ) {

    window.open(
      url,
      "_blank"
    );

  }

}


/* =========================
   HISTORY
========================= */

function saveHistory(text) {

  let history =
    JSON.parse(
      localStorage.getItem("qrifyHistory") || "[]"
    );

  history.unshift(text);

  history =
    history.slice(0, 5);

  localStorage.setItem(
    "qrifyHistory",
    JSON.stringify(history)
  );

  displayHistory();
}


function displayHistory() {

  const container =
    document.getElementById("history");

  const history =
    JSON.parse(
      localStorage.getItem("qrifyHistory") || "[]"
    );


  if (history.length === 0) {

    container.innerHTML =
      "<p>No history yet.</p>";

    return;
  }


  container.innerHTML = "";


  history.forEach(function(item) {

    const div =
      document.createElement("div");

    div.className =
      "history-item";

    div.textContent =
      item;

    container.appendChild(div);

  });

}


function clearHistory() {

  localStorage.removeItem(
    "qrifyHistory"
  );

  displayHistory();

}


/* =========================
   DARK MODE
========================= */

function toggleDarkMode() {

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "qrifyDark",
    document.body.classList.contains("dark")
  );

}


if (
  localStorage.getItem("qrifyDark") === "true"
) {

  document.body.classList.add("dark");

}


/* =========================
   LOAD HISTORY
========================= */

displayHistory();


/* =========================
   PWA SERVICE WORKER
========================= */

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./sw.js")
        .catch(function(error) {

          console.log(
            "Service Worker error:",
            error
          );

        });

    }
  );

}

</script>

</body>
    </html>
