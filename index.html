<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QRify - Advanced QR Generator</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111;
      transition: 0.3s;
    }

    body.dark {
      background: #121212;
      color: #fff;
    }

    .container {
      max-width: 550px;
      margin: 20px auto;
      padding: 25px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    body.dark .container {
      background: #1e1e1e;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    body.dark .subtitle {
      color: #bbb;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    textarea {
      height: 110px;
      resize: vertical;
    }

    body.dark input,
    body.dark textarea,
    body.dark select {
      background: #2b2b2b;
      color: white;
      border-color: #555;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .download {
      background: #16803c;
    }

    .share {
      background: #2563eb;
    }

    .clear {
      background: #666;
    }

    .dark-btn {
      background: #333;
    }

    .field {
      display: none;
    }

    #qr {
      display: flex;
      justify-content: center;
      margin-top: 25px;
      padding: 15px;
    }

    #message {
      text-align: center;
      color: #666;
    }

    body.dark #message {
      color: #bbb;
    }

    #actions {
      display: none;
    }

    .history {
      margin-top: 30px;
      border-top: 1px solid #ddd;
      padding-top: 20px;
    }

    body.dark .history {
      border-color: #444;
    }

    .history-item {
      background: #f1f1f1;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
      word-break: break-word;
    }

    body.dark .history-item {
      background: #2b2b2b;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>QRify</h1>

  <p class="subtitle">
    Advanced QR Code Generator
  </p>

  <!-- QR TYPE -->

  <label>QR Type</label>

  <select id="type" onchange="changeType()">
    <option value="text">
