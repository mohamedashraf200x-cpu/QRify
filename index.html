<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QRify</title>

  <!-- App icon -->
  <link rel="icon" type="image/png" href="logo.png">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QRify">

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      transition: 0.3s;
    }

    body.dark {
      background: #111827;
      color: white;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .logo {
      text-align: center;
      margin-bottom: 5px;
    }

    .logo img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      border-radius: 20px;
    }

    h1 {
      text-align: center;
      margin: 5px 0;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 20px;
    }

    body.dark .subtitle {
      color: #d1d5db;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    body.dark .card {
      background: #1f2937;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > div {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate {
      background: #2563eb;
      color: white;
    }

    .download {
      background: #16a34a;
      color: white;
    }

    .clear {
      background: #dc2626;
      color: white;
    }

    .dark-btn {
      background: #374151;
      color: white;
    }

    #qrBox {
      display: flex;
      justify-content: center;
      margin-top: 25px;
      min-height: 20px;
    }

    #history {
      margin-top: 25px;
    }

    .history-item {
      background: #f3f4f6;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      word-break: break-word;
    }

    body.dark .history-item {
      background: #374151;
    }

    .hidden {
      display: none;
    }

    footer {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: #6b7280;
    }

    body.dark footer {
      color: #d1d5db;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <img src="logo.png" alt="QRify Logo">
  </div>

  <h1>QRify</h1>
  <p class="subtitle">Generate • Scan • Simplify</p>

  <div class="card">

    <label>QR Type</label>

    <select id="type" onchange="changeType()">
      <option value="text">Text</option>
      <option value="website">Website</option>
      <option value="phone">Phone</option>
      <option value="email">Email</option>
      <option value="wifi">Wi-Fi</option>
      <option value="contact">Contact</option>
      <option value="location">Location</option>
    </select>

    <div id="inputs">

      <label>Enter Text</label>
      <textarea id="text" placeholder="Type your text here..."></textarea>

    </div>

    <div class="row">

      <div>
        <label>QR Size</label>
        <select id="size">
          <option value="150">Small</option>
          <option value="200" selected>Medium</option>
          <option value="300">Large</option>
        </select>
      </div>

      <div>
        <label>QR Color</label>
        <input type="color" id="qrColor" value="#000000">
      </div>

    </div>

    <label>Background Color</label>
    <input type="color" id="bgColor" value="#ffffff">

    <button class="generate" onclick="generateQR()">
      Generate QR
    </button>

    <div id="qrBox"></div>

    <button class="download hidden" id="downloadBtn" onclick="downloadQR()">
      Download QR
    </button>

    <button class="clear" onclick="clearQR()">
      Clear
    </button>

    <button class="dark-btn" onclick="toggleDarkMode()">
      🌙 Dark Mode
    </button>

    <div id="history">
      <h3>Recent History</h3>
      <div id="historyList"></div>
    </div>

  </div>

  <footer>
    QRify • Generate your QR instantly<br>
    By Ashraf
  </footer>

</div>

<script>

let currentQR = null;

/* Change input based on QR type */
function changeType() {

  const type = document.getElementById("type").value;
  const inputs = document.getElementById("inputs");

  if (type === "text") {

    inputs.innerHTML = `
      <label>Enter Text</label>
      <textarea id="text" placeholder="Type your text here..."></textarea>
    `;

  }

  else if (type === "website") {

    inputs.innerHTML = `
      <label>Website URL</label>
      <input id="text" type="url" placeholder="https://example.com">
    `;

  }

  else if (type === "phone") {

    inputs.innerHTML = `
      <label>Phone Number</label>
      <input id="text" type="tel" placeholder="+91 9876543210">
    `;

  }

  else if (type === "email") {

    inputs.innerHTML = `
      <label>Email Address</label>
      <input id="text" type="email" placeholder="example@email.com">
      <label>Subject</label>
      <input id="subject" type="text" placeholder="Subject">
      <label>Message</label>
      <textarea id="message" placeholder="Message"></textarea>
    `;

  }

  else if (type === "wifi") {

    inputs.innerHTML = `
      <label>Wi-Fi Name</label>
      <input id="ssid" placeholder="Wi-Fi name">

      <label>Password</label>
      <input id="password" type="text" placeholder="Wi-Fi password">

      <label>Security</label>
      <select id="security">
        <option value="WPA">WPA/WPA2</option>
        <option value="WEP">WEP</option>
        <option value="nopass">No Password</option>
      </select>
    `;

  }

  else if (type === "contact") {

    inputs.innerHTML = `
      <label>Name</label>
      <input id="name" placeholder="Full name">

      <label>Phone</label>
      <input id="phone" placeholder="+91 9876543210">

      <label>Email</label>
      <input id="email" type="email" placeholder="email@example.com">

      <label>Organization</label>
      <input id="org" placeholder="Organization">
    `;

  }

  else if (type === "location") {

    inputs.innerHTML = `
      <label>Google Maps Location / Link</label>
      <input id="text" placeholder="Paste Google Maps link">
    `;
  }
}


/* Generate QR */
function generateQR() {

  const type = document.getElementById("type").value;
  const size = parseInt(document.getElementById("size").value);
  const qrColor = document.getElementById("qrColor").value;
  const bgColor = document.getElementById("bgColor").value;

  let data = "";

  if (type === "text" ||
      type === "website" ||
      type === "phone" ||
      type === "location") {

    data = document.getElementById("text").value.trim();

  }

  else if (type === "email") {

    const email = document.getElementById("text").value.trim();
    const subject = document.getElementById("subject").value.trim();
    const message = document.getElementById("message").value.trim();

    data =
      "mailto:" + email +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(message);

  }

  else if (type === "wifi") {

    const ssid = document.getElementById("ssid").value;
    const password = document.getElementById("password").value;
    const security = document.getElementById("security").value;

    data =
      `WIFI:T:${security};S:${ssid};P:${password};;`;

  }

  else if (type === "contact") {

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const email = document.getElementById("email").value;
    const org = document.getElementById("org").value;

    data =
      `BEGIN:VCARD
VERSION:3.0
FN:${name}
TEL:${phone}
EMAIL:${email}
ORG:${org}
END:VCARD`;

  }

  if (!data) {
    alert("Please enter the required information.");
    return;
  }

  const qrBox = document.getElementById("qrBox");

  qrBox.innerHTML = "";

  currentQR = new QRCode(qrBox, {
    text: data,
    width: size,
    height: size,
    colorDark: qrColor,
    colorLight: bgColor,
    correctLevel: QRCode.CorrectLevel.H
  });

  document.getElementById("downloadBtn").classList.remove("hidden");

  saveHistory(data);
}


/* Download QR */
function downloadQR() {

  const qrBox = document.getElementById("qrBox");
  const canvas = qrBox.querySelector("canvas");

  if (!canvas) {
    alert("Generate a QR first.");
    return;
  }

  const link = document.createElement("a");

  link.download = "QRify-QR.png";
  link.href = canvas.toDataURL("image/png");

  link.click();
}


/* Clear */
function clearQR() {

  document.getElementById("qrBox").innerHTML = "";

  document.getElementById("downloadBtn").classList.add("hidden");
}


/* Dark mode */
function toggleDarkMode() {

  document.body.classList.toggle("dark");

  const isDark =
    document.body.classList.contains("dark");

  localStorage.setItem("qrifyDark", isDark);
}


/* Load dark mode */
if (localStorage.getItem("qrifyDark") === "true") {
  document.body.classList.add("dark");
}


/* History */
function saveHistory(data) {

  let history =
    JSON.parse(localStorage.getItem("qrifyHistory")) || [];

  history.unshift(data);

  history = history.slice(0, 5);

  localStorage.setItem(
    "qrifyHistory",
    JSON.stringify(history)
  );

  displayHistory();
}


/* Display history */
function displayHistory() {

  const list =
    document.getElementById("historyList");

  let history =
    JSON.parse(localStorage.getItem("qrifyHistory")) || [];

  list.innerHTML = "";

  history.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "history-item";

    div.textContent = item;

    list.appendChild(div);

  });
}


displayHistory();


/* Register Service Worker */
if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker.register("sw.js")
      .then(() => console.log("QRify app ready"))
      .catch(() => console.log("Service worker failed"));

  });

}

</script>

</body>
</html>
