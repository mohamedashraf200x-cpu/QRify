<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QRify - Generate & Scan QR</title>

  <!-- Google Search Console Verification -->
  <meta name="google-site-verification"
        content="5HCcQf2Dkuhb6cXjoyaUMdktFcyYmGymxjnBAaxDoyA" />

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="QRify">

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      transition: 0.3s;
    }

    body.dark {
      background: #111827;
      color: #f9fafb;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header img {
      width: 90px;
      max-width: 100%;
      margin-bottom: 8px;
    }

    header h1 {
      margin: 5px 0;
    }

    header p {
      margin: 5px 0;
      opacity: 0.8;
    }

    .container {
      width: 95%;
      max-width: 700px;
      margin: 20px auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    body.dark .card {
      background: #1f2937;
      color: white;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    body.dark input,
    body.dark textarea,
    body.dark select {
      background: #374151;
      color: white;
      border-color: #4b5563;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > div {
      flex: 1;
    }

    button {
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 12px;
      background: #2563eb;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .generate {
      width: 100%;
      font-size: 17px;
      font-weight: bold;
      background: #7c3aed;
    }

    .clear {
      background: #ef4444;
    }

    .download {
      background: #059669;
    }

    .dark-btn {
      background: #374151;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    #qrcode img,
    #qrcode canvas {
      max-width: 100%;
      height: auto;
    }

    .result-box {
      text-align: center;
      word-break: break-word;
    }

    .history-item {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      word-break: break-word;
    }

    body.dark .history-item {
      border-color: #4b5563;
    }

    .hidden {
      display: none;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #scanResult {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #e5e7eb;
      word-break: break-word;
    }

    body.dark #scanResult {
      background: #374151;
    }

    footer {
      text-align: center;
      padding: 20px;
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      .row {
        flex-direction: column;
      }

      .card {
        padding: 16px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>

  <img src="logo.png" alt="QRify Logo">

  <h1>QRify</h1>

  <p>Generate • Scan • Simplify</p>

  <button class="dark-btn" onclick="toggleDarkMode()">
    🌙 Dark Mode
  </button>

</header>


<div class="container">

  <!-- QR GENERATOR -->

  <div class="card">

    <h2>Generate QR Code</h2>

    <label for="qrType">QR Type</label>

    <select id="qrType" onchange="selectType(this.value)">

      <option value="text">📝 Text</option>

      <option value="website">🌐 Website</option>

      <option value="phone">📞 Phone</option>

      <option value="email">📧 Email</option>

      <option value="wifi">📶 Wi-Fi</option>

      <option value="contact">👤 Contact</option>

      <option value="location">📍 Location</option>

    </select>


    <!-- TEXT -->

    <div id="textSection">

      <label for="textInput">Message</label>

      <textarea
        id="textInput"
        placeholder="Enter your text or message"></textarea>

    </div>


    <!-- WEBSITE -->

    <div id="websiteSection" class="hidden">

      <label for="websiteInput">Website URL</label>

      <input
        type="url"
        id="websiteInput"
        placeholder="https://example.com">

    </div>


    <!-- PHONE -->

    <div id="phoneSection" class="hidden">

      <label for="phoneInput">Phone Number</label>

      <input
        type="tel"
        id="phoneInput"
        placeholder="+91 9876543210">

    </div>


    <!-- EMAIL -->

    <div id="emailSection" class="hidden">

      <label for="emailInput">Email</label>

      <input
        type="email"
        id="emailInput"
        placeholder="example@gmail.com">

      <label for="emailSubject">Subject</label>

      <input
        type="text"
        id="emailSubject"
        placeholder="Email subject">

      <label for="emailMessage">Message</label>

      <textarea
        id="emailMessage"
        placeholder="Email message"></textarea>

    </div>


    <!-- WIFI -->

    <div id="wifiSection" class="hidden">

      <label for="wifiSSID">Wi-Fi Name (SSID)</label>

      <input
        type="text"
        id="wifiSSID"
        placeholder="Wi-Fi name">

      <label for="wifiPassword">Password</label>

      <input
        type="text"
        id="wifiPassword"
        placeholder="Wi-Fi password">

      <label for="wifiSecurity">Security</label>

      <select id="wifiSecurity">

        <option value="WPA">WPA/WPA2</option>

        <option value="WEP">WEP</option>

        <option value="nopass">No Password</option>

      </select>

    </div>


    <!-- CONTACT -->

    <div id="contactSection" class="hidden">

      <label for="contactName">Name</label>

      <input
        type="text"
        id="contactName"
        placeholder="Full name">

      <label for="contactPhone">Phone</label>

      <input
        type="tel"
        id="contactPhone"
        placeholder="+91 9876543210">

      <label for="contactEmail">Email</label>

      <input
        type="email"
        id="contactEmail"
        placeholder="example@gmail.com">

      <label for="contactOrg">Organization</label>

      <input
        type="text"
        id="contactOrg"
        placeholder="Company / Organization">

    </div>


    <!-- LOCATION -->

    <div id="locationSection" class="hidden">

      <label for="latitude">Latitude</label>

      <input
        type="text"
        id="latitude"
        placeholder="Example: 12.9716">

      <label for="longitude">Longitude</label>

      <input
        type="text"
        id="longitude"
        placeholder="Example: 77.5946">

    </div>


    <!-- QR SETTINGS -->

    <h3>QR Settings</h3>

    <label for="qrSize">QR Size</label>

    <select id="qrSize">

      <option value="180">Small</option>

      <option value="250" selected>Medium</option>

      <option value="350">Large</option>

    </select>


    <div class="row">

      <div>

        <label for="qrColor">QR Color</label>

        <input
          type="color"
          id="qrColor"
          value="#000000">

      </div>

      <div>

        <label for="bgColor">Background</label>

        <input
          type="color"
          id="bgColor"
          value="#ffffff">

      </div>

    </div>


    <button
      class="generate"
      onclick="generateQR()">

      ⚡ Generate QR

    </button>


    <button
      class="clear"
      onclick="clearAll()">

      🗑 Clear

    </button>

  </div>


  <!-- QR RESULT -->

  <div class="card result-box">

    <h2>Your QR Code</h2>

    <div id="qrcode"></div>

    <button
      id="downloadBtn"
      class="download hidden"
      onclick="downloadQR()">

      ⬇ Download QR

    </button>

  </div>


  <!-- QR SCANNER -->

  <div class="card">

    <h2>📷 Scan QR Code</h2>

    <button onclick="startCameraScan()">

      📸 Camera Scan

    </button>

    <button
      onclick="document.getElementById('qrFile').click()">

      🖼 Scan Image

    </button>

    <input
      type="file"
      id="qrFile"
      accept="image/*"
      class="hidden"
      onchange="scanImage(event)">

    <div id="reader"></div>

    <div id="scanResult" class="hidden">

      <strong>Scan Result:</strong>

      <p id="scanText"></p>

      <button
        id="openLinkBtn"
        class="hidden"
        onclick="openScannedLink()">

        🔗 Open Link

      </button>

    </div>

  </div>


  <!-- HISTORY -->

  <div class="card">

    <h2>🕘 QR History</h2>

    <div id="history">
      <p>No history yet.</p>
    </div>

    <button
      class="clear"
      onclick="clearHistory()">

      Clear History

    </button>

  </div>

</div>


<footer>

  QRify — Generate • Scan • Simplify

  <br>

  By Ashraf

</footer>


<script>

  /* QR TYPE */

  function selectType(type) {

    const sections = [

      "textSection",
      "websiteSection",
      "phoneSection",
      "emailSection",
      "wifiSection",
      "contactSection",
      "locationSection"

    ];

    sections.forEach(function(id) {

      document
        .getElementById(id)
        .classList.add("hidden");

    });

    document
      .getElementById(type + "Section")
      .classList.remove("hidden");
  }


  /* GET QR DATA */

  function getQRData() {

    const type =
      document.getElementById("qrType").value;


    if (type === "text") {

      const text =
        document
          .getElementById("textInput")
          .value
          .trim();

      if (!text) {

        alert("Please enter some text.");

        return null;
      }

      return text;
    }


    if (type === "website") {

      let url =
        document
          .getElementById("websiteInput")
          .value
          .trim();

      if (!url) {

        alert("Please enter a website URL.");

        return null;
      }

      if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
      ) {

        url = "https://" + url;
      }

      return url;
    }


    if (type === "phone") {

      const phone =
        document
          .getElementById("phoneInput")
          .value
          .trim();

      if (!phone) {

        alert("Please enter a phone number.");

        return null;
      }

      return "tel:" + phone;
    }


    if (type === "email") {

      const email =
        document
          .getElementById("emailInput")
          .value
          .trim();

      const subject =
        document
          .getElementById("emailSubject")
          .value
          .trim();

      const message =
        document
          .getElementById("emailMessage")
          .value
          .trim();

      if (!email) {

        alert("Please enter an email address.");

        return null;
      }

      return (
        "mailto:" +
        email +
        "?subject=" +
        encodeURIComponent(subject) +
        "&body=" +
        encodeURIComponent(message)
      );
    }


    if (type === "wifi") {

      const ssid =
        document.getElementById("wifiSSID").value;

      const password =
        document.getElementById("wifiPassword").value;

      const security =
        document.getElementById("wifiSecurity").value;


      if (!ssid) {

        alert("Please enter Wi-Fi name.");

        return null;
      }


      function escapeWifi(value) {

        return value
          .replace(/\\/g, "\\\\")
          .replace(/;/g, "\\;")
          .replace(/,/g, "\\,")
          .replace(/:/g, "\\:");

      }


      return (
        "WIFI:" +
        "T:" + security +
        ";" +
        "S:" + escapeWifi(ssid) +
        ";" +
        "P:" + escapeWifi(password) +
        ";;"
      );
    }


    if (type === "contact") {

      const name =
        document
          .getElementById("contactName")
          .value
          .trim();

      const phone =
        document
          .getElementById("contactPhone")
          .value
          .trim();

      const email =
        document
          .getElementById("contactEmail")
          .value
          .trim();

      const org =
        document
          .getElementById("contactOrg")
          .value
          .trim();


      if (!name && !phone && !email) {

        alert("Please enter contact details.");

        return null;
      }


      return (
        "BEGIN:VCARD\n" +
        "VERSION:3.0\n" +
        "FN:" + name + "\n" +
        "TEL:" + phone + "\n" +
        "EMAIL:" + email + "\n" +
        "ORG:" + org + "\n" +
        "END:VCARD"
      );
    }


    if (type === "location") {

      const latitude =
        document
          .getElementById("latitude")
          .value
          .trim();

      const longitude =
        document
          .getElementById("longitude")
          .value
          .trim();


      if (!latitude || !longitude) {

        alert(
          "Please enter latitude and longitude."
        );

        return null;
      }


      return (
        "https://www.google.com/maps?q=" +
        latitude +
        "," +
        longitude
      );
    }


    return null;
  }


  /* GENERATE */

  let currentQRData = "";


  function generateQR() {

    const data = getQRData();

    if (!data) {
      return;
    }

    currentQRData = data;


    const qrContainer =
      document.getElementById("qrcode");

    qrContainer.innerHTML = "";


    const size =
      parseInt(
        document.getElementById("qrSize").value
      );


    const color =
      document.getElementById("qrColor").value;


    const background =
      document.getElementById("bgColor").value;


    new QRCode(qrContainer, {

      text: data,

      width: size,

      height: size,

      colorDark: color,

      colorLight: background,

      correctLevel:
        QRCode.CorrectLevel.H

    });


    document
      .getElementById("downloadBtn")
      .classList.remove("hidden");


    saveHistory(data);
  }


  /* DOWNLOAD */

  function downloadQR() {

    const canvas =
      document.querySelector("#qrcode canvas");

    const image =
      document.querySelector("#qrcode img");


    let source = canvas || image;


    if (!source) {

      alert("Generate a QR code first.");

      return;
    }


    const size =
      source.width || 250;

    const border = 30;


    const downloadCanvas =
      document.createElement("canvas");


    downloadCanvas.width =
      size + border * 2;

    downloadCanvas.height =
      size + border * 2;


    const ctx =
      downloadCanvas.getContext("2d");


    ctx.fillStyle = "#ffffff";


    ctx.fillRect(
      0,
      0,
      downloadCanvas.width,
      downloadCanvas.height
    );


    ctx.drawImage(
      source,
      border,
      border,
      size,
      size
    );


    const link =
      document.createElement("a");


    link.download =
      "QRify-QR.png";


    link.href =
      downloadCanvas.toDataURL("image/png");


    link.click();
  }


  /* CLEAR */

  function clearAll() {

    document
      .querySelectorAll(
        "input:not([type=color]), textarea"
      )
      .forEach(function(input) {

        input.value = "";

      });


    document
      .getElementById("qrcode")
      .innerHTML = "";


    document
      .getElementById("downloadBtn")
      .classList.add("hidden");


    currentQRData = "";


    document
      .getElementById("qrType")
      .value = "text";


    selectType("text");
  }


  /* HISTORY */

  function saveHistory(data) {

    let history =
      JSON.parse(
        localStorage.getItem("qrifyHistory") || "[]"
      );


    history.unshift(data);


    history =
      history.slice(0, 5);


    localStorage.setItem(
      "qrifyHistory",
      JSON.stringify(history)
    );


    displayHistory();
  }


  function displayHistory() {

    const container =
      document.getElementById("history");


    let history =
      JSON.parse(
        localStorage.getItem("qrifyHistory") || "[]"
      );


    if (history.length === 0) {

      container.innerHTML =
        "<p>No history yet.</p>";

      return;
    }


    container.innerHTML = "";


    history.forEach(function(item, index) {

      const div =
        document.createElement("div");


      div.className =
        "history-item";


      div.textContent =
        (index + 1) + ". " + item;


      container.appendChild(div);

    });
  }


  function clearHistory() {

    localStorage.removeItem(
      "qrifyHistory"
    );

    displayHistory();
  }


  /* DARK MODE */

  function toggleDarkMode() {

    document.body.classList.toggle("dark");


    const isDark =
      document.body.classList.contains("dark");


    localStorage.setItem(
      "qrifyDarkMode",
      isDark ? "on" : "off"
    );
  }


  if (
    localStorage.getItem("qrifyDarkMode") === "on"
  ) {

    document.body.classList.add("dark");

  }


  /* CAMERA SCANNER */

  let html5QrCode = null;


  function startCameraScan() {

    const reader =
      document.getElementById("reader");


    reader.innerHTML = "";


    html5QrCode =
      new Html5Qrcode("reader");


    html5QrCode.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,
        qrbox: 250
      },

      function(decodedText) {

        showScanResult(decodedText);


        html5QrCode.stop()
          .then(function() {

            reader.innerHTML = "";

          })
          .catch(function() {});

      },

      function(errorMessage) {}

    ).catch(function(error) {

      alert(
        "Camera scan could not start. Please allow camera permission."
      );

    });
  }


  /* IMAGE SCANNER */

  function scanImage(event) {

    const file =
      event.target.files[0];


    if (!file) {
      return;
    }


    const scanner =
      new Html5Qrcode("reader");


    scanner
      .scanFile(file, true)

      .then(function(decodedText) {

        showScanResult(decodedText);

      })

      .catch(function(error) {

        alert(
          "Could not find a QR code in this image."
        );

      });
  }


  /* SCAN RESULT */

  let scannedLink = "";


  function showScanResult(text) {

    const resultBox =
      document.getElementById("scanResult");


    const resultText =
      document.getElementById("scanText");


    const openButton =
      document.getElementById("openLinkBtn");


    resultBox.classList.remove("hidden");


    resultText.textContent = text;


    scannedLink = "";


    const url = text.trim();


    if (
      url.startsWith("http://") ||
      url.startsWith("https://")
    ) {

      scannedLink = url;

      openButton.classList.remove("hidden");

    }

    else if (
      url.startsWith("www.")
    ) {

      scannedLink =
        "https://" + url;

      openButton.classList.remove("hidden");

    }

    else {

      openButton.classList.add("hidden");

    }
  }


  function openScannedLink() {

    if (!scannedLink) {
      return;
    }


    window.open(
      scannedLink,
      "_blank"
    );
  }


  /* INITIALIZE */

  selectType("text");

  displayHistory();


  /* SERVICE WORKER */

  if ("serviceWorker" in navigator) {

    window.addEventListener(
      "load",
      function() {

        navigator.serviceWorker
          .register("./sw.js")
          .catch(function(error) {

            console.log(
              "Service Worker error:",
              error
            );

          });

      }
    );
  }

</script>

</body>
  </html>
