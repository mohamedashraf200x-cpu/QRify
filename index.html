<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QRify - QR Code Generator</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .secondary {
      background: #555;
    }

    .download {
      background: #16803c;
    }

    #qr {
      display: flex;
      justify-content: center;
      margin-top: 25px;
    }

    #message {
      text-align: center;
      color: #555;
      margin-top: 15px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>QRify</h1>

    <p class="subtitle">
      Turn your information into a QR code
    </p>

    <textarea
      id="text"
      placeholder="Enter text, website link, phone number, email, etc..."
    ></textarea>

    <button onclick="generateQR()">
      Generate QR Code
    </button>

    <div id="qr"></div>

    <p id="message"></p>

    <div id="actions" class="hidden">

      <button class="download" onclick="downloadQR()">
        Download QR
      </button>

      <button onclick="shareQR()">
        Share QR
      </button>

      <button class="secondary" onclick="clearQR()">
        Clear
      </button>

    </div>

  </div>

  <script>

    function generateQR() {

      const text = document.getElementById("text").value.trim();
      const qr = document.getElementById("qr");
      const message = document.getElementById("message");
      const actions = document.getElementById("actions");

      qr.innerHTML = "";
      message.innerHTML = "";
      actions.classList.add("hidden");

      if (text === "") {
        message.innerHTML = "Please enter some information first.";
        return;
      }

      new QRCode(qr, {
        text: text,
        width: 250,
        height: 250,
        correctLevel: QRCode.CorrectLevel.H
      });

      message.innerHTML = "QR Code generated successfully!";

      actions.classList.remove("hidden");
    }


    function downloadQR() {

      const qrCanvas = document.querySelector("#qr canvas");

      if (!qrCanvas) {
        alert("Please generate a QR code first.");
        return;
      }

      const link = document.createElement("a");

      link.download = "QRify-QR-Code.png";

      link.href = qrCanvas.toDataURL("image/png");

      link.click();
    }


    async function shareQR() {

      const qrCanvas = document.querySelector("#qr canvas");

      if (!qrCanvas) {
        alert("Please generate a QR code first.");
        return;
      }

      try {

        const blob = await new Promise(resolve =>
          qrCanvas.toBlob(resolve, "image/png")
        );

        const file = new File(
          [blob],
          "QRify-QR-Code.png",
          { type: "image/png" }
        );

        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({ files: [file] })
        ) {

          await navigator.share({
            title: "QRify QR Code",
            text: "QR Code created with QRify",
            files: [file]
          });

        } else {

          alert("Sharing is not supported on this browser. Please use Download QR.");

        }

      } catch (error) {

        console.log(error);

      }
    }


    function clearQR() {

      document.getElementById("text").value = "";
      document.getElementById("qr").innerHTML = "";
      document.getElementById("message").innerHTML = "";

      document
        .getElementById("actions")
        .classList.add("hidden");
    }

  </script>

</body>
</html>
