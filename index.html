<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QRify - Advanced QR Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #111;
  transition: 0.3s;
}

body.dark {
  background: #121212;
  color: white;
}

.container {
  max-width: 550px;
  margin: 20px auto;
  padding: 25px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

body.dark .container {
  background: #1e1e1e;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 25px;
}

body.dark .subtitle {
  color: #bbb;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
  font-weight: bold;
}

select,
input,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

textarea {
  height: 110px;
  resize: vertical;
}

body.dark input,
body.dark textarea,
body.dark select {
  background: #2b2b2b;
  color: white;
  border-color: #555;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 14px;
  border: none;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.download {
  background: #16803c;
}

.share {
  background: #2563eb;
}

.clear {
  background: #666;
}

.dark-btn {
  background: #333;
}

.field {
  display: none;
}

#qr {
  display: flex;
  justify-content: center;
  margin-top: 25px;
  padding: 15px;
}

#message {
  text-align: center;
  color: #666;
}

body.dark #message {
  color: #bbb;
}

#actions {
  display: none;
}

.history {
  margin-top: 30px;
  border-top: 1px solid #ddd;
  padding-top: 20px;
}

body.dark .history {
  border-color: #444;
}

.history-item {
  background: #f1f1f1;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  word-break: break-word;
}

body.dark .history-item {
  background: #2b2b2b;
}
</style>
</head>

<body>

<div class="container">

<h1>QRify</h1>

<p class="subtitle">
Advanced QR Code Generator
</p>

<label>QR Type</label>

<select id="type" onchange="changeType()">
<option value="text">📝 Text</option>
<option value="url">🌐 Website</option>
<option value="phone">📞 Phone</option>
<option value="email">📧 Email</option>
<option value="wifi">📶 Wi-Fi</option>
<option value="contact">👤 Contact</option>
<option value="location">📍 Location</option>
</select>

<div id="textField" class="field">

<label>Text</label>

<textarea id="text" placeholder="Enter your text..."></textarea>

</div>

<div id="urlField" class="field">

<label>Website URL</label>

<input id="url" type="url" placeholder="https://example.com">

</div>

<div id="phoneField" class="field">

<label>Phone Number</label>

<input id="phone" type="tel" placeholder="+91 9876543210">

</div>

<div id="emailField" class="field">

<label>Email</label>

<input id="email" type="email" placeholder="example@email.com">

<label>Subject</label>

<input id="subject" type="text" placeholder="Email subject">

<label>Message</label>

<textarea id="emailMessage" placeholder="Email message"></textarea>

</div>

<div id="wifiField" class="field">

<label>Wi-Fi Name</label>

<input id="wifiName" placeholder="Wi-Fi name">

<label>Password</label>

<input id="wifiPassword" type="text" placeholder="Wi-Fi password">

<label>Security</label>

<select id="wifiSecurity">
<option value="WPA">WPA/WPA2</option>
<option value="WEP">WEP</option>
<option value="nopass">No Password</option>
</select>

</div>

<div id="contactField" class="field">

<label>Name</label>

<input id="contactName" placeholder="John">

<label>Phone</label>

<input id="contactPhone" placeholder="+91 9876543210">

<label>Email</label>

<input id="contactEmail" placeholder="john@email.com">

</div>

<div id="locationField" class="field">

<label>Latitude</label>

<input id="latitude" placeholder="12.9716">

<label>Longitude</label>

<input id="longitude" placeholder="77.5946">

</div>

<label>QR Size</label>

<select id="size">
<option value="180">Small</option>
<option value="250" selected>Medium</option>
<option value="320">Large</option>
</select>

<label>QR Color</label>

<input id="qrColor" type="color" value="#000000">

<label>Background Color</label>

<input id="bgColor" type="color" value="#ffffff">

<button onclick="generateQR()">
Generate QR Code
</button>

<div id="qr"></div>

<p id="message"></p>

<div id="actions">

<button class="download" onclick="downloadQR()">
📥 Download QR
</button>

<button class="share" onclick="shareQR()">
📤 Share QR
</button>

<button class="clear" onclick="clearQR()">
🗑️ Clear
</button>

</div>

<button class="dark-btn" onclick="toggleDarkMode()">
🌙 Dark Mode
</button>

<div class="history">

<h3>🕘 Recent QR History</h3>

<div id="historyList"></div>

</div>

</div>

<script>

changeType();

function changeType() {

const type =
document.getElementById("type").value;

const fields =
document.querySelectorAll(".field");

fields.forEach(function(field) {

field.style.display = "none";

});

const selected =
document.getElementById(type + "Field");

if (selected) {

selected.style.display = "block";

}

}

function getQRContent() {

const type =
document.getElementById("type").value;

let content = "";

if (type === "text") {

content =
document.getElementById("text").value.trim();

}

else if (type === "url") {

content =
document.getElementById("url").value.trim();

}

else if (type === "phone") {

const phone =
document.getElementById("phone").value.trim();

content = "tel:" + phone;

}

else if (type === "email") {

const email =
document.getElementById("email").value.trim();

const subject =
document.getElementById("subject").value.trim();

const message =
document.getElementById("emailMessage").value.trim();

content =
"mailto:" + email +
"?subject=" +
encodeURIComponent(subject) +
"&body=" +
encodeURIComponent(message);

}

else if (type === "wifi") {

const name =
document.getElementById("wifiName").value;

const password =
document.getElementById("wifiPassword").value;

const security =
document.getElementById("wifiSecurity").value;

content =
"WIFI:T:" +
security +
";S:" +
name +
";P:" +
password +
";;";

}

else if (type === "contact") {

const name =
document.getElementById("contactName").value;

const phone =
document.getElementById("contactPhone").value;

const email =
document.getElementById("contactEmail").value;

content =
"BEGIN:VCARD\n" +
"VERSION:3.0\n" +
"FN:" + name + "\n" +
"TEL:" + phone + "\n" +
"EMAIL:" + email + "\n" +
"END:VCARD";

}

else if (type === "location") {

const latitude =
document.getElementById("latitude").value;

const longitude =
document.getElementById("longitude").value;

content =
"https://maps.google.com/?q=" +
latitude +
"," +
longitude;

}

return content;

}

function generateQR() {

const content =
getQRContent();

const qr =
document.getElementById("qr");

const message =
document.getElementById("message");

const actions =
document.getElementById("actions");

qr.innerHTML = "";

message.innerHTML = "";

actions.style.display = "none";

if (content.trim() === "") {

message.innerHTML =
"Please enter the required information.";

return;

}

const size =
parseInt(
document.getElementById("size").value
);

const color =
document.getElementById("qrColor").value;

const background =
document.getElementById("bgColor").value;

new QRCode(qr, {

text: content,

width: size,

height: size,

colorDark: color,

colorLight: background,

correctLevel:
QRCode.CorrectLevel.H

});

message.innerHTML =
"✅ QR Code generated successfully!";

actions.style.display = "block";

saveHistory(content);

}

function downloadQR() {

const canvas =
document.querySelector("#qr canvas");

if (!canvas) {

alert("Generate a QR code first.");

return;

}

const link =
document.createElement("a");

link.download =
"QRify-QR-Code.png";

link.href =
canvas.toDataURL("image/png");

link.click();

}

async function shareQR() {

const canvas =
document.querySelector("#qr canvas");

if (!canvas) {

alert("Generate a QR code first.");

return;

}

try {

const blob =
await new Promise(resolve =>
canvas.toBlob(
resolve,
"image/png"
)
);

const file =
new File(
[blob],
"QRify-QR-Code.png",
{ type: "image/png" }
);

if (
navigator.share &&
navigator.canShare &&
navigator.canShare({ files: [file] })
) {

await navigator.share({

title: "QRify QR Code",

text: "QR Code created with QRify",

files: [file]

});

}

else {

alert(
"Sharing is not supported. Please use Download QR."
);

}

}

catch (error) {

console.log(error);

}

}

function clearQR() {

document.getElementById("qr").innerHTML = "";

document.getElementById("message").innerHTML = "";

document.getElementById("actions").style.display =
"none";

}

function toggleDarkMode() {

document.body.classList.toggle("dark");

}

function saveHistory(content) {

let history =
JSON.parse(
localStorage.getItem("qrifyHistory") || "[]"
);

history.unshift(content);

history =
history.slice(0, 5);

localStorage.setItem(
"qrifyHistory",
JSON.stringify(history)
);

showHistory();

}

const list =
document.getElementById("historyList");

let history =
