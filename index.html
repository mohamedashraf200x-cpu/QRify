<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QRify - Free QR Code Generator & Scanner</title>

  <meta name="description" content="QRify is a free QR code generator and scanner for text, websites, phone numbers, email, Wi-Fi, contacts and locations.">

  <meta name="google-site-verification"
        content="5HCcQf2Dkuhb6cXjoyaUMdktFcyYmGymxjnBAaxDoyA">

  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="QRify">

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      transition: 0.3s;
    }

    body.dark {
      background: #111827;
      color: #f9fafb;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header img {
      width: 180px;
      max-width: 80%;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    body.dark .card {
      background: #1f2937;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      margin: 6px 4px 0 0;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    body.dark .secondary {
      background: #374151;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .result {
      text-align: center;
      margin-top: 20px;
    }

    #qrcode {
      display: inline-block;
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-top: 10px;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    .hidden {
      display: none;
    }

    .history-item {
      background: #f3f4f6;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      word-break: break-word;
    }

    body.dark .history-item {
      background: #374151;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #6b7280;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > * {
      flex: 1;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      .row {
        flex-direction: column;
      }

      button {
        width: 100%;
        margin-right: 0;
      }
    }
  </style>
</head>

<body>

<header>
  <img src="logo.png" alt="QRify Logo">
</header>

<div class="container">

  <!-- QR GENERATOR -->
  <div class="card">

    <h2>Generate QR Code</h2>

    <label for="qrType">QR Type</label>

    <select id="qrType" onchange="showFields()">
      <option value="text">📝 Text</option>
      <option value="website">🌐 Website</option>
      <option value="phone">📞 Phone</option>
      <option value="email">📧 Email</option>
      <option value="wifi">📶 Wi-Fi</option>
      <option value="contact">👤 Contact</option>
      <option value="location">📍 Location</option>
    </select>

    <!-- TEXT -->
    <div id="textFields">
      <label>Message</label>
      <textarea id="text"></textarea>
    </div>

    <!-- WEBSITE -->
    <div id="websiteFields" class="hidden">
      <label>Website URL</label>
      <input id="website" placeholder="https://example.com">
    </div>

    <!-- PHONE -->
    <div id="phoneFields" class="hidden">
      <label>Phone Number</label>
      <input id="phone" type="tel">
    </div>

    <!-- EMAIL -->
    <div id="emailFields" class="hidden">
      <label>Email</label>
      <input id="email" type="email">

      <label>Subject</label>
      <input id="emailSubject">

      <label>Message</label>
      <textarea id="emailMessage"></textarea>
    </div>

    <!-- WIFI -->
    <div id="wifiFields" class="hidden">
      <label>Wi-Fi Name (SSID)</label>
      <input id="wifiSSID">

      <label>Password</label>
      <input id="wifiPassword" type="password">

      <label>Security</label>
      <select id="wifiSecurity">
        <option value="WPA">WPA/WPA2</option>
        <option value="WEP">WEP</option>
        <option value="nopass">No Password</option>
      </select>
    </div>

    <!-- CONTACT -->
    <div id="contactFields" class="hidden">
      <label>Name</label>
      <input id="contactName">

      <label>Phone</label>
      <input id="contactPhone">

      <label>Email</label>
      <input id="contactEmail">

      <label>Organization</label>
      <input id="contactOrg">
    </div>

    <!-- LOCATION -->
    <div id="locationFields" class="hidden">

      <label>Latitude</label>
      <input id="latitude" type="number" step="any">

      <label>Longitude</label>
      <input id="longitude" type="number" step="any">

    </div>

    <label>QR Size</label>

    <select id="qrSize">
      <option value="150">Small</option>
      <option value="220" selected>Medium</option>
      <option value="300">Large</option>
    </select>

    <div class="row">

      <div>
        <label>QR Color</label>
        <input type="color" id="qrColor" value="#000000">
      </div>

      <div>
        <label>Background</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>

    </div>

    <br>

    <button class="primary" onclick="generateQR()">
      Generate QR
    </button>

    <button class="secondary" onclick="clearAll()">
      Clear
    </button>

  </div>


  <!-- QR RESULT -->
  <div class="card result">

    <h2>Your QR Code</h2>

    <div id="qrcode"></div>

    <br>

    <button id="downloadBtn"
            class="primary hidden"
            onclick="downloadQR()">
      Download QR
    </button>

  </div>


  <!-- SCANNER -->
  <div class="card">

    <h2>Scan QR Code</h2>

    <button class="primary" onclick="startCameraScan()">
      📷 Camera Scan
    </button>

    <button class="secondary" onclick="document.getElementById('qrFile').click()">
      🖼️ Scan Image
    </button>

    <input
      type="file"
      id="qrFile"
      accept="image/*"
      class="hidden"
      onchange="scanImage(event)"
    >

    <div id="reader"></div>

    <div id="scanResult" class="hidden">

      <h3>Scan Result</h3>

      <p id="scanText"></p>

      <button
        id="openLinkBtn"
        class="primary hidden"
        onclick="openScannedLink()">
        Open Link
      </button>

    </div>

  </div>


  <!-- HISTORY -->
  <div class="card">

    <h2>Recent QR History</h2>

    <div id="history"></div>

  </div>


  <!-- DARK MODE -->
  <div class="card">

    <button class="secondary" onclick="toggleDarkMode()">
      🌙 Dark Mode
    </button>

  </div>

</div>


<footer>
  QRify — Generate • Scan • Simplify
  <br>
  By Ashraf
</footer>


<script>

let scannedLink = "";
let qrCodeInstance = null;


// SHOW FIELDS
function showFields() {

  const fields = [
    "textFields",
    "websiteFields",
    "phoneFields",
    "emailFields",
    "wifiFields",
    "contactFields",
    "locationFields"
  ];

  fields.forEach(id => {
    document.getElementById(id).classList.add("hidden");
  });

  const type = document.getElementById("qrType").value;

  document.getElementById(type + "Fields").classList.remove("hidden");
}


// GENERATE QR DATA
function getQRData() {

  const type = document.getElementById("qrType").value;

  if (type === "text") {

    return document.getElementById("text").value;

  }

  if (type === "website") {

    let url = document.getElementById("website").value.trim();

    if (
      url &&
      !url.startsWith("http://") &&
      !url.startsWith("https://")
    ) {
      url = "https://" + url;
    }

    return url;

  }

  if (type === "phone") {

    return "tel:" + document.getElementById("phone").value;

  }

  if (type === "email") {

    const email = document.getElementById("email").value;

    const subject =
      encodeURIComponent(
        document.getElementById("emailSubject").value
      );

    const message =
      encodeURIComponent(
        document.getElementById("emailMessage").value
      );

    return `mailto:${email}?subject=${subject}&body=${message}`;

  }

  if (type === "wifi") {

    const ssid = document.getElementById("wifiSSID").value;
    const password = document.getElementById("wifiPassword").value;
    const security = document.getElementById("wifiSecurity").value;

    return `WIFI:T:${security};S:${ssid};P:${password};;`;

  }

  if (type === "contact") {

    const name = document.getElementById("contactName").value;
    const phone = document.getElementById("contactPhone").value;
    const email = document.getElementById("contactEmail").value;
    const org = document.getElementById("contactOrg").value;

    return `BEGIN:VCARD
VERSION:3.0
FN:${name}
TEL:${phone}
EMAIL:${email}
ORG:${org}
END:VCARD`;

  }

  if (type === "location") {

    const lat = document.getElementById("latitude").value;
    const lon = document.getElementById("longitude").value;

    return `geo:${lat},${lon}`;

  }

}


// GENERATE
function generateQR() {

  const data = getQRData();

  if (!data.trim()) {
    alert("Please enter some information.");
    return;
  }

  const size =
    parseInt(document.getElementById("qrSize").value);

  const color =
    document.getElementById("qrColor").value;

  const background =
    document.getElementById("bgColor").value;

  const qrContainer =
    document.getElementById("qrcode");

  qrContainer.innerHTML = "";

  qrCodeInstance = new QRCode(qrContainer, {

    text: data,

    width: size,

    height: size,

    colorDark: color,

    colorLight: background,

    correctLevel: QRCode.CorrectLevel.H

  });

  document
    .getElementById("downloadBtn")
    .classList.remove("hidden");

  saveHistory(data);

}


// DOWNLOAD QR
function downloadQR() {

  const canvas =
    document.querySelector("#qrcode canvas");

  if (!canvas) {
    alert("Generate a QR code first.");
    return;
  }

  const border = 20;

  const newCanvas =
    document.createElement("canvas");

  newCanvas.width =
    canvas.width + border * 2;

  newCanvas.height =
    canvas.height + border * 2;

  const ctx =
    newCanvas.getContext("2d");

  ctx.fillStyle = "#ffffff";

  ctx.fillRect(
    0,
    0,
    newCanvas.width,
    newCanvas.height
  );

  ctx.drawImage(
    canvas,
    border,
    border
  );

  const link =
    document.createElement("a");

  link.download = "QRify-QR.png";

  link.href =
    newCanvas.toDataURL("image/png");

  link.click();

}


// CLEAR
function clearAll() {

  document.querySelectorAll(
    "input, textarea"
  ).forEach(element => {

    if (element.type === "color") return;

    element.value = "";

  });

  document.getElementById("qrcode").innerHTML = "";

  document
    .getElementById("downloadBtn")
    .classList.add("hidden");

}


// HISTORY
function saveHistory(data) {

  let history =
    JSON.parse(
      localStorage.getItem("qrifyHistory") || "[]"
    );

  history.unshift(data);

  history =
    history.slice(0, 5);

  localStorage.setItem(
    "qrifyHistory",
    JSON.stringify(history)
  );

  displayHistory();

}


function displayHistory() {

  const history =
    JSON.parse(
      localStorage.getItem("qrifyHistory") || "[]"
    );

  const container =
    document.getElementById("history");

  container.innerHTML = "";

  if (history.length === 0) {

    container.innerHTML =
      "<p>No recent QR codes.</p>";

    return;

  }

  history.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "history-item";

    div.textContent = item;

    container.appendChild(div);

  });

}


// DARK MODE
function toggleDarkMode() {

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "qrifyDarkMode",
    document.body.classList.contains("dark")
  );

}


if (
  localStorage.getItem("qrifyDarkMode") === "true"
) {

  document.body.classList.add("dark");

}


// CAMERA SCANNER
let html5QrCode = null;

function startCameraScan() {

  document.getElementById("reader").innerHTML = "";

  html5QrCode =
    new Html5Qrcode("reader");

  html5QrCode.start(

    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: 250
    },

    qrCodeMessage => {

      showScanResult(qrCodeMessage);

      html5QrCode.stop();

    },

    errorMessage => {}

  ).catch(error => {

    alert(
      "Camera permission is required to scan QR codes."
    );

  });

}


// IMAGE SCAN
function scanImage(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  const scanner =
    new Html5Qrcode("reader");

  scanner.scanFile(file, true)

    .then(decodedText => {

      showScanResult(decodedText);

    })

    .catch(error => {

      alert("Could not find a QR code in this image.");

    });

}


// SCAN RESULT
function showScanResult(text) {

  const result =
    document.getElementById("scanResult");

  const scanText =
    document.getElementById("scanText");

  const openButton =
    document.getElementById("openLinkBtn");

  scanText.textContent = text;

  result.classList.remove("hidden");

  if (
    text.startsWith("http://") ||
    text.startsWith("https://") ||
    text.startsWith("www.")
  ) {

    scannedLink = text;

    if (text.startsWith("www.")) {
      scannedLink = "https://" + text;
    }

    openButton.classList.remove("hidden");

  } else {

    openButton.classList.add("hidden");

  }

}


// OPEN SCANNED LINK
function openScannedLink() {

  if (scannedLink) {

    window.open(
      scannedLink,
      "_blank"
    );

  }

}


// DISPLAY HISTORY ON LOAD
displayHistory();


// SHOW DEFAULT FIELDS
showFields();


// SERVICE WORKER
if ("serviceWorker" in navigator) {

  window.addEventListener("load", function() {

    navigator.serviceWorker
      .register("./sw.js")
      .catch(function(error) {

        console.log(
          "Service Worker error:",
          error
        );

      });

  });

}

</script>

</body>
        </html>
